# Test branch only: builds the debug app, hosts the home-screen widgets on emulators (Android 14 and Android 10)
# and keeps the screenshots on the branch «widget-shots». The release build is in build.yml.
name: Виджеты на эмуляторе

on:
  push:
    branches: [widget-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-shot
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Зависимости
        run: npm ci
      - name: Веб-часть в приложение
        run: node scripts/prepare-www.js www && npx cap sync android
      - name: Отладочная сборка
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор и снимки
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Europe/Bucharest
          script: bash tools/widget/widget-shot.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shots-${{ matrix.api }}
          path: shots
          if-no-files-found: warn

  publish:
    needs: shots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/in
          pattern: shots-*
          merge-multiple: true
      - name: Снимки в ветку widget-shots
        run: |
          git config user.name "widget-shot"
          git config user.email "widget-shot@users.noreply.github.com"
          git checkout --orphan widget-shots-tmp
          git rm -rf --cached . > /dev/null
          rm -rf shots && mkdir -p shots && cp -r /tmp/in/. shots/
          git add -f shots
          git commit -m "widget shots ${{ github.run_number }}"
          git push -f origin HEAD:refs/heads/widget-shots
