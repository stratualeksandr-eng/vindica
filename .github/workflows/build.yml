# Собирает «Верни себя себе» после каждой загрузки файлов в репозиторий:
#   Android — Vindica.apk (напоминания ставятся в сам телефон и приходят при закрытом приложении),
#   Windows — установщик Vindica-Setup-….exe, Linux — Vindica-….AppImage, macOS — по кнопке «Run workflow» с галочкой.
# Готовые файлы появляются в разделе Releases; самая свежая сборка всегда по ссылке …/releases/latest
name: Сборка приложений

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mac:
        description: Собрать и для macOS
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Зависимости
        run: npm ci
      - name: Веб-часть в приложение
        env:
          VINDICA_VERSION: 1.0.${{ github.run_number }}
        run: node scripts/prepare-www.js www && npx cap sync android
      - name: Сборка APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Файл
        run: cp android/app/build/outputs/apk/release/app-release.apk Vindica.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: Vindica.apk
          if-no-files-found: error

  desktop:
    name: Компьютер (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.mac && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Веб-часть в программу
        env:
          VINDICA_VERSION: 1.0.${{ github.run_number }}
        run: node scripts/prepare-www.js desktop/www
      - name: Зависимости
        working-directory: desktop
        run: npm ci
      - name: Сборка
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
          if-no-files-found: error

  release:
    name: Выпуск
    needs: [android, desktop]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Верни себя себе 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** открой эту страницу на телефоне, скачай `Vindica.apk` и открой его. Новая версия ставится поверх старой, записи сохраняются.
            **Windows:** `Vindica-Setup-…exe`. Программа живёт в трее и запускается вместе с компьютером, чтобы напоминания приходили вовремя.
            **Linux:** `Vindica-…AppImage`. **macOS:** `Vindica-…-mac.dmg` (собирается по кнопке Run workflow с галочкой).
          files: out/*
